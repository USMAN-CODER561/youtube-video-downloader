services:
  - type: web
    name: yt-dlp-downloader
    env: node
    region: oregon
    plan: free

    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: YTDLP_PATH
        value: /opt/render/project/src/bin/yt-dlp
      - key: FFMPEG_PATH
        value: ./bin/ffmpeg
      - key: NODE_ENV
        value: production

